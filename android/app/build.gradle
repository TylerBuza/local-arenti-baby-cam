plugins { id 'com.android.application' }

android {
    namespace 'dev.tvmodding.privatecamera'
    compileSdk 36
    defaultConfig {
        applicationId 'dev.tvmodding.localarentibabycam'
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName '0.1.0-beta'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    buildTypes { release { minifyEnabled false } }
    testOptions { unitTests.returnDefaultValues = true }
    packaging { resources { excludes += 'META-INF/versions/**/OSGI-INF/MANIFEST.MF' } }
    sourceSets {
        androidTest.assets.srcDir("$buildDir/generated/fixtureAssets")
        debug.assets.srcDir("$buildDir/generated/familyFixtureAssets")
    }
}


dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.core:core:1.16.0'
    implementation 'androidx.media3:media3-exoplayer:1.11.1'
    implementation 'androidx.media3:media3-ui:1.11.1'
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
    implementation 'org.bouncycastle:bcpkix-jdk18on:1.83'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test:core:1.6.1'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}
